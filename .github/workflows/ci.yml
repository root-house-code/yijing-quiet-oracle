name: CI

# Run the test suite on pull requests. (Pushes to main are covered by the
# deploy workflow, which also runs the tests before building.)
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
